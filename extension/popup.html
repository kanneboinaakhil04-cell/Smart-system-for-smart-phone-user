<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 1rem;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.8rem;
    }
    .title { font-weight: 700; font-size: 1rem; }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 0.8rem;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .stat-label { font-size: 0.75rem; color: #94a3b8; }
    .stat-val { font-size: 1.3rem; font-weight: 800; color: #60a5fa; margin-top: 0.2rem; }
    .btn {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">PB</div>
    <div class="title">PhoneBalance Guard</div>
  </div>
  <div class="card">
    <div class="stat-label">Mindful Friction</div>
    <div class="stat-val">Active 🛡️</div>
    <div style="font-size: 0.75rem; color: #10b981; margin-top: 0.25rem;">Intercepting 6 Distracting Sites</div>
  </div>
  <div class="card">
    <div class="stat-label">Localhost API Connection</div>
    <div style="font-size: 0.85rem; color: #cbd5e1; margin-top: 0.25rem;">http://127.0.0.1:8000</div>
  </div>
  <button class="btn" id="open-dashboard">Open PhoneBalance Web</button>
  <script src="popup.js"></script>
</body>
</html>
